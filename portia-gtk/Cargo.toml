[package]
name = "portia-gtk"
description = "Spike, not API: GTK 4 on portia's Io."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Outside the portia workspace, so that the workspace builds without GTK's
# system libraries. Needs GTK 4.14 or later; see the README.
[workspace]

[dependencies]
portia = { path = "../portia", features = ["derive"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }

[[test]]
name = "scenarios"
harness = false
