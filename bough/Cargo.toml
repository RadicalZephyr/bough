[package]
name = "bough"
description = "Lightweight FRP rooted in Rust: a Sodium-semantics engine with a build-time and I/O-time separation."
readme = "../README.md"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
# The standard library: the thread-id guard on `Remote`, `Trace` for the
# standard collections and `Instant`, and the standard mutex under input
# slots. Off for bare metal; a web build keeps it.
std = []
# Guards input slots on bare metal with the critical section every HAL
# implements. The default feature set has no runtime dependency.
critical-section = ["dep:critical-section"]
# Re-exports `#[derive(Trace)]` from `bough-derive`.
derive = ["dep:bough-derive"]
# Per-transaction phase counters for attributing a regression to a phase.
statistics = []
# Spike scaffolding, not API: `bough::smoke` builds and drives a graph with
# every node kind the engine has so far, so that a library build for a
# bare-metal target pushes the generic engine through code generation.
smoke = []

[dependencies]
bough-derive = { workspace = true, optional = true }
critical-section = { workspace = true, optional = true }
