[workspace]
resolver = "3"
members = ["bough", "bough-derive", "bough-oracle", "bough-bench", "bough-repl"]
# The GTK spike needs GTK's system libraries, so it is a workspace of its own.
exclude = ["bough-gtk"]

[workspace.package]
version = "0.1.0"
authors = ["Zefira Shannon"]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/bough-frp/bough"

[workspace.dependencies]
bough = { path = "bough", version = "0.1.0" }
bough-derive = { path = "bough-derive", version = "0.1.0" }
bough-oracle = { path = "bough-oracle", version = "0.1.0" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
proptest = { version = "1", default-features = false, features = ["std"] }
critical-section = "1"
criterion = "0.5"
gungraun = "=0.19.4"
# Pinned to master: 18.0.1 holds a watch line printed just after a command
# until the next keypress. Move to the first release after it. buffer-redux
# keeps type-ahead from being dropped between readlines.
rustyline = { git = "https://github.com/kkawakam/rustyline", rev = "05eb9200f178989ad504718179f11890cfe362c9", features = ["buffer-redux"] }
