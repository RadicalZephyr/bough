[package]
name = "bough-gtk"
description = "Spike, not API: GTK 4 on bough's same-thread handle."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Outside the bough workspace, so that the workspace builds without GTK's
# system libraries. Needs GTK 4.14 or later; see the README.
[workspace]

[dependencies]
bough = { path = "../bough", features = ["derive"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }

[[test]]
name = "scenarios"
harness = false
